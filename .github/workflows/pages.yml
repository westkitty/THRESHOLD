name: Deploy THRESHOLD PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify protected questionnaire and limits
        run: node tests/verify.mjs
      - name: Generate site from canonical standalone app
        run: node tools/build-pages.mjs
      - name: Test PWA parity, scope and offline behavior
        run: node tests/pwa.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only published shell assets
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
